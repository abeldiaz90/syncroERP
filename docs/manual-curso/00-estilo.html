<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SyncroERP + Apache Fineract · Manual de operación</title>
<style>
  @page { size: Letter; margin: 20mm 18mm 18mm 18mm; }

  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 10pt; line-height: 1.58; color: #16161a; margin: 0; background: #fff;
  }
  .sans { font-family: "Helvetica Neue", Arial, sans-serif; }

  /* ── Portada ─────────────────────────────────────────────────────────── */
  .portada { height: 238mm; page-break-after: always; position: relative;
             border-top: 6px solid #16161a; padding-top: 10mm; }
  .portada .emisor { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 8pt;
    letter-spacing: .26em; text-transform: uppercase; color: #6b6b6b; }
  .portada h1 { font-size: 36pt; line-height: 1.04; margin: 22mm 0 0; font-weight: normal;
                letter-spacing: -0.01em; }
  .portada h1 em { font-style: normal; display: block; font-size: 22pt; color: #6b6b6b;
                   margin-top: 3mm; letter-spacing: 0; }
  .portada .regla { border-top: 1px solid #16161a; margin: 10mm 0 6mm; }
  .portada .sub { font-size: 12pt; color: #333; max-width: 118mm; text-align: left; }
  .portada .ficha { position: absolute; bottom: 0; left: 0; right: 0;
    border-top: 3px solid #16161a; padding-top: 4mm;
    font-family: "Helvetica Neue", Arial, sans-serif; font-size: 8.5pt; color: #4a4a4a; }
  .portada .ficha table { width: 100%; border: 0; font-size: 8.5pt; margin: 0; }
  .portada .ficha td { border: 0; padding: .8mm 0; vertical-align: top; }
  .portada .ficha td:first-child { width: 34mm; color: #8a8a8a;
    text-transform: uppercase; letter-spacing: .1em; font-size: 7.5pt; }
  .portada .marca { position: absolute; top: 10mm; right: 0; width: 26mm; height: 26mm;
                    background: #7a2230; }

  /* ── Divisores de parte ──────────────────────────────────────────────── */
  .parte { page-break-before: always; page-break-after: always; height: 230mm;
           display: flex; flex-direction: column; justify-content: center; }
  .parte .num { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 8.5pt;
    letter-spacing: .28em; text-transform: uppercase; color: #7a2230; }
  .parte h1 { font-size: 30pt; font-weight: normal; margin: 3mm 0 0; }
  .parte .regla { border-top: 3px solid #16161a; width: 40mm; margin: 6mm 0 7mm; }
  .parte p { font-size: 11pt; color: #3a3a3a; max-width: 130mm; text-align: left; }
  .parte ol { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 9pt;
              color: #4a4a4a; margin-top: 9mm; columns: 2; column-gap: 12mm; }
  .parte ol li { margin: 1.4mm 0; break-inside: avoid; }

  /* ── Títulos ─────────────────────────────────────────────────────────── */
  h2 { page-break-before: always; font-size: 18pt; font-weight: normal; margin: 0 0 6mm;
       padding-bottom: 3mm; border-bottom: 2px solid #16161a; }
  h2 .cap { display: block; font-family: "Helvetica Neue", Arial, sans-serif;
            font-size: 8pt; letter-spacing: .24em; text-transform: uppercase;
            color: #7a2230; margin-bottom: 2mm; }
  h3 { font-size: 12pt; font-weight: bold; margin: 7mm 0 2mm; page-break-after: avoid;
       border-bottom: 1px solid #c9c5bd; padding-bottom: 1.2mm; }
  h4 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 9.5pt; font-weight: bold;
       margin: 5mm 0 1.5mm; page-break-after: avoid; color: #16161a; }
  h5 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 8pt; font-weight: bold;
       letter-spacing: .14em; text-transform: uppercase; color: #6b6b6b;
       margin: 4mm 0 1.5mm; page-break-after: avoid; }
  p { margin: 2.2mm 0; orphans: 2; widows: 2; text-align: justify; hyphens: auto; }
  ul, ol { margin: 2.5mm 0; padding-left: 6mm; }
  li { margin: 1.2mm 0; }
  code, .cod { font-family: "Courier New", Courier, monospace; font-size: .9em; color: #16161a; }
  .cod { white-space: nowrap; }

  /* ── Tablas: sólo reglas horizontales ────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; margin: 3.5mm 0;
          font-family: "Helvetica Neue", Arial, sans-serif; font-size: 8.4pt; line-height: 1.45; }
  thead { display: table-header-group; }
  th { text-align: left; font-weight: bold; font-size: 7.6pt; letter-spacing: .08em;
       text-transform: uppercase; color: #16161a; padding: 1.6mm 2.6mm 1.6mm 0;
       border-top: 1.5px solid #16161a; border-bottom: 1px solid #16161a; }
  td { padding: 1.6mm 2.6mm 1.6mm 0; vertical-align: top; border-bottom: .5px solid #d5d1c9; }
  tr { page-break-inside: avoid; }
  .ob { font-size: 7pt; font-weight: bold; letter-spacing: .06em; color: #7a2230;
        font-family: "Helvetica Neue", Arial, sans-serif; white-space: nowrap; }
  .op { font-size: 7pt; letter-spacing: .06em; color: #8a8a8a;
        font-family: "Helvetica Neue", Arial, sans-serif; white-space: nowrap; }
  .campo { font-family: "Courier New", Courier, monospace; font-size: 8.2pt; }

  /* ── Figuras ─────────────────────────────────────────────────────────── */
  figure { margin: 4.5mm 0 5.5mm; page-break-inside: avoid; }
  figure img { width: 100%; border: .5px solid #b9b5ad; display: block; }
  figcaption { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 7.6pt;
               color: #5a5a5a; margin-top: 1.6mm; line-height: 1.45;
               padding-left: 3mm; border-left: 2px solid #c9c5bd; text-align: left; }
  figcaption b { color: #16161a; }

  /* ── Notas ───────────────────────────────────────────────────────────── */
  .nota { margin: 4mm 0; padding: 0 0 0 5mm; border-left: 2px solid #16161a;
          page-break-inside: avoid; font-size: 9.4pt; }
  .nota.sec { border-left-color: #7a2230; }
  .nota.tenue { border-left-color: #b9b5ad; color: #3a3a3a; }
  .nota .rot { display: block; font-family: "Helvetica Neue", Arial, sans-serif;
               font-size: 7.4pt; letter-spacing: .16em; text-transform: uppercase;
               font-weight: bold; margin-bottom: 1.4mm; color: #16161a; }
  .nota.sec .rot { color: #7a2230; }
  .nota p { margin: 1.6mm 0; }
  .nota p:first-of-type { margin-top: 0; } .nota p:last-child { margin-bottom: 0; }

  /* ── Secuencia de pasos ──────────────────────────────────────────────── */
  ol.pasos { list-style: none; padding: 0; margin: 4mm 0; counter-reset: paso; }
  ol.pasos > li { counter-increment: paso; position: relative; padding-left: 10mm;
                  margin: 3.5mm 0; page-break-inside: avoid; }
  ol.pasos > li::before { content: counter(paso, decimal-leading-zero);
    position: absolute; left: 0; top: 0.2mm;
    font-family: "Helvetica Neue", Arial, sans-serif; font-size: 9pt; font-weight: bold;
    color: #7a2230; }
  ol.pasos > li > b { display: block; font-size: 10.5pt; margin-bottom: .8mm; }
  .quien { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 7.4pt;
    letter-spacing: .1em; text-transform: uppercase; color: #6b6b6b; font-weight: bold; }

  /* ── Cinta de flujo ──────────────────────────────────────────────────── */
  .cinta { display: table; width: 100%; margin: 4mm 0; page-break-inside: avoid;
           border-top: 1.5px solid #16161a; border-bottom: 1.5px solid #16161a; }
  .cinta > div { display: table-cell; width: 1%; padding: 2.6mm 3mm 2.6mm 0;
                 font-family: "Helvetica Neue", Arial, sans-serif; font-size: 7.8pt;
                 vertical-align: top; line-height: 1.4; color: #3a3a3a; }
  .cinta > div + div { border-left: .5px solid #c9c5bd; padding-left: 3mm; }
  .cinta .q { display: block; font-size: 6.8pt; letter-spacing: .12em;
              text-transform: uppercase; color: #7a2230; font-weight: bold; margin-bottom: .8mm; }
  .cinta b { display: block; color: #16161a; font-size: 8.6pt; margin-bottom: .6mm; }

  /* ── Etiqueta de rol ─────────────────────────────────────────────────── */
  .rol { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 7.4pt;
         letter-spacing: .12em; text-transform: uppercase; font-weight: bold;
         color: #16161a; border: .8px solid #16161a; padding: .4mm 1.6mm;
         display: inline-block; vertical-align: 1.2px; }
  .roles-cab { margin: 0 0 4mm; }

  /* ── Índice ──────────────────────────────────────────────────────────── */
  .indice { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 8.6pt;
            columns: 2; column-gap: 10mm; }
  .indice div { break-inside: avoid; }
  .indice .l0 { font-size: 9.5pt; font-weight: bold; letter-spacing: .1em;
    text-transform: uppercase; color: #7a2230; margin: 5mm 0 1.5mm;
    border-bottom: 1px solid #16161a; padding-bottom: 1mm; }
  .indice .l0:first-child { margin-top: 0; }
  .indice .l1 { color: #16161a; margin: 1.2mm 0; }
  .indice .l2 { color: #6b6b6b; padding-left: 4mm; font-size: 8pt; margin-bottom: 1.5mm; }

  /* ── Paso suelto (bloques heredados) ─────────────────────────────────── */
  .pasoq { margin: 3.5mm 0; padding-left: 5mm; border-left: 2px solid #c9c5bd;
           page-break-inside: avoid; }
  .pasoq > b { display: block; font-size: 10.5pt; margin-bottom: .8mm; }

  /* ── Divisor de parte: la lista no va a dos columnas si es corta ─────── */
  .parte ol.una { columns: 1; }
</style>
</head>
<body>
