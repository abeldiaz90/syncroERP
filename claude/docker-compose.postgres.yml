services:
  syncroerp-postgres:
    image: postgres:16-alpine
    container_name: syncroerp-postgres
    restart: unless-stopped
    env_file:
      - backend/.env.local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - syncroerp_postgres_data:/var/lib/postgresql/data

volumes:
  syncroerp_postgres_data:
